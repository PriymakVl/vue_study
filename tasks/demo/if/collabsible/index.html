<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Vue 3 Аккордеон</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    .container {
      width: 600px;
      margin: 100px auto 0;
    }
    
    .header {
      cursor: pointer;
      background-color: #f0f0f0;
      padding: 10px;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .content {
      padding: 10px;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 4px 4px;
    }

    .icon {
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="header" @click="toggle">
        <span class="header-text">{{ isOpen ? 'Закрыть' : 'Открыть' }}</span>
        <span class="icon">{{ isOpen ? '-' : '+' }}</span>
      </div>
      <div class="content" v-show="isOpen">
        Это содержимое, которое можно показать или скрыть.
      </div>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          isOpen: true
        }
      },
      methods: {
        toggle() {
          this.isOpen = !this.isOpen;
        }
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
