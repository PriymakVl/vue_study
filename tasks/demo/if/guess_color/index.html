<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .color-box{
            width: 100px;
            height: 100px;
            margin: 10px;
            display: inline-block;
            cursor: pointer;
        }
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h2>Угадай цвет : {{correctColor}}</h2>
        <div class="color-boxes">
            <div @click="checkColor(colors[0])" :style="{ backgroundColor: colors[0] }" class="color-box"></div>
            <div  @click="checkColor(colors[1])" :style="{ backgroundColor: colors[1] }" class="color-box"></div>
            <div @click="checkColor(colors[2])" :style="{ backgroundColor: colors[2] }" class="color-box"></div>
            <div @click="checkColor(colors[3])" :style="{ backgroundColor: colors[3] }" class="color-box"></div>
        </div>
        <p v-if="text">{{text}}</p>
        <button @click="initColors">Начать заново</button>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const {createApp} = Vue;
        let app={
           data(){
               return{
                   colors: [],
                   text:'',
                   correctColor: ''
               }
           },
           created(){
                this.initColors();
           },
           methods:{
             randomColor(){
                const r = Math.floor(Math.random() * 256);
                const g = Math.floor(Math.random() * 256);
                const b = Math.floor(Math.random() * 256);
                return `rgb(${r}, ${g}, ${b})`;
             },
             initColors(){
                this.colors = [];      
                for(let i = 0; i < 4; i++){
                    this.colors.push(this.randomColor());
                }
                let randomIndex = Math.floor(Math.random() * 4);
                this.correctColor = this.colors[randomIndex];
             },
             checkColor(color){
                if(color === this.correctColor){
                    this.text = 'Поздравляем! Вы угадали цвет!';
                }
                else{
                    this.text = 'Попробуйте снова!';
                }
             }
           }
        };
        createApp(app).mount('#app');
    </script>
</body>
</html>
