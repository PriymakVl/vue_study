<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Угадай цвет</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .color-boxes {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .box {
      width: 100px;
      height: 100px;
      border: 3px solid #333;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .box:hover {
      transform: scale(1.05);
    }
    .result {
      font-size: 20px;
      margin-top: 15px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="app">
    <h2>Угадай цвет: <strong>{{ targetColor }}</strong></h2>

    <div class="color-boxes">
      <div
        class="box"
        v-for="(color, index) in colors"
        :key="index"
        :style="{ backgroundColor: color }"
        @click="guess(index)"
      ></div>
    </div>

    <div class="result">{{ message }}</div>
    <button @click="startGame">Новая игра</button>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          colors: [],
          correctIndex: null,
          targetColor: '',
          message: ''
        };
      },
      methods: {
        getRandomColor() {
          const r = Math.floor(Math.random() * 256);
          const g = Math.floor(Math.random() * 256);
          const b = Math.floor(Math.random() * 256);
          return `rgb(${r}, ${g}, ${b})`;
        },
        startGame() {
          this.colors = [];
          for (let i = 0; i < 4; i++) {
            this.colors.push(this.getRandomColor());
          }
          this.correctIndex = Math.floor(Math.random() * 4);
          this.targetColor = this.colors[this.correctIndex];
          this.message = '';
        },
        guess(index) {
          if (index === this.correctIndex) {
            this.message = '✅ Правильно!';
          } else {
            this.message = '❌ Неверно. Попробуй ещё.';
          }
        }
      },
      mounted() {
        this.startGame();
      }
    }).mount('#app');
  </script>
</body>
</html>
