<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Список задач на Vue</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    .container {
      width: 400px;
      margin: 50px auto;
      font-family: sans-serif;
      text-align: center;
    }

    input {
      width: 65%;
      padding: 8px;
      font-size: 1rem;
    }

    button {
      padding: 8px 12px;
      font-size: 1rem;
      margin-left: 5px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background-color: #f2f2f2;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.3s;
      text-align: left;
    }

    li:hover {
      background-color: #e0e0e0;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <h1>Список задач</h1>
    <input type="text" v-model="newTask" placeholder="Введите задачу">
    <button @click="addTask">Добавить</button>

    <ul>
      <li v-for="(task, index) in tasks" :key="index" @click="deleteTask(index)">
        {{ task }}
      </li>
    </ul>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          newTask: '',
          tasks: []
        };
      },
      methods: {
        addTask() {
          if (this.newTask.trim() !== '') {
            this.tasks.push(this.newTask.trim());
            this.newTask = '';
          }
        },
        deleteTask(index) {
          this.tasks.splice(index, 1);
        }
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
