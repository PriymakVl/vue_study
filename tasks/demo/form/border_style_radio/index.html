<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Vue Border Style</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    .box {
      width: 200px;
      height: 100px;
      border: 4px solid black;
      margin-top: 20px;
    }

    label {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <label>
      <input type="radio" value="solid" v-model="borderStyle"> Solid
    </label>
    <label>
      <input type="radio" value="dashed" v-model="borderStyle"> Dashed
    </label>
    <label>
      <input type="radio" value="dotted" v-model="borderStyle"> Dotted
    </label>

    <div class="box" :style="{ borderStyle: borderStyle }"></div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          borderStyle: 'solid'
        };
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
