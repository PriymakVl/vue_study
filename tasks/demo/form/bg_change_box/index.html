<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Цветовой генератор (Vue 3)</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        #app {
            max-width: 400px;
            margin: auto;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .slider {
            margin-bottom: 15px;
        }

        .slider label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .slider input {
            width: 100%;
        }

        #box {
            width: 100%;
            height: 100px;
            margin-top: 20px;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        #out {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>Background Change Box</h1>
        <div class="slider">
            <label for="red">Красный: {{ red }}</label>
            <input type="range" id="red" v-model="red" min="0" max="255">
        </div>

        <div class="slider">
            <label for="green">Зелёный: {{ green }}</label>
            <input type="range" id="green" v-model="green" min="0" max="255">
        </div>

        <div class="slider">
            <label for="blue">Синий: {{ blue }}</label>
            <input type="range" id="blue" v-model="blue" min="0" max="255">
        </div>

        <div id="box" :style="{ backgroundColor: rgbColor }"></div>

        <div id="out">Цвет: <span>{{ rgbColor }}</span></div>
    </div>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    red: 0,
                    green: 0,
                    blue: 0
                };
            },
            computed: {
                rgbColor() {
                    return `rgb(${this.red}, ${this.green}, ${this.blue})`;
                }
            }
        });

        app.mount('#app');
    </script>
</body>

</html>
