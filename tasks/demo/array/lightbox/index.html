<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Vue 3 Lightbox</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .gallery img {
      width: 200px;
      height: 150px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 5px;
    }
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
<div id="app">
  <div class="gallery">
    <img 
      v-for="img in images" 
      :key="img" 
      :src="img" 
      @click="openLightbox(img)">
  </div>

  <div v-if="lightboxImage" class="lightbox" @click="closeLightbox">
    <img :src="lightboxImage">
  </div>
</div>

<script>
const app = Vue.createApp({
  data() {
    return {
      images: [
        'https://placehold.co/800x600?text=Фото+1',
        'https://placehold.co/800x600?text=Фото+2',
        'https://placehold.co/800x600?text=Фото+3',
        'https://placehold.co/800x600?text=Фото+4'
      ],
      lightboxImage: null
    };
  },
  methods: {
    openLightbox(img) {
      this.lightboxImage = img;
    },
    closeLightbox() {
      this.lightboxImage = null;
    }
  }
});

app.mount('#app');
</script>
</body>
</html>
