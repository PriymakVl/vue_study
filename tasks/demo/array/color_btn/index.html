<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Vue кнопка</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <button 
      @click="changeColor" 
      :style="{ color: currentColor }">
      Нажми меня
    </button>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          currentColor: 'black',
          colors: ['black', 'red', 'green', 'blue', 'orange'],
          index: 0
        };
      },
      methods: {
        changeColor() {
          this.index = (this.index + 1) % this.colors.length;
          this.currentColor = this.colors[this.index];
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
