<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Камень-Ножницы-Бумага</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    .score {
      margin-top: 20px;
      font-size: 20px;
    }
    .result {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Камень - Ножницы - Бумага</h1>
    <div>
      <button @click="play('Камень')">Камень</button>
      <button @click="play('Ножницы')">Ножницы</button>
      <button @click="play('Бумага')">Бумага</button>
    </div>

    <div class="result" v-if="playerChoice">
      <p>Вы выбрали: {{ playerChoice }}</p>
      <p>Компьютер выбрал: {{ computerChoice }}</p>
      <p>{{ result }}</p>
    </div>

    <div class="score">
      <p>Счёт Игрока: {{ playerScore }}</p>
      <p>Счёт Компьютера: {{ computerScore }}</p>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          playerChoice: '',
          computerChoice: '',
          result: '',
          playerScore: 0,
          computerScore: 0,
          choices: ['Камень', 'Ножницы', 'Бумага']
        }
      },
      methods: {
        play(choice) {
          this.playerChoice = choice;
          this.computerChoice = this.choices[Math.floor(Math.random() * 3)];
          this.checkWinner();
        },
        checkWinner() {
          if (this.playerChoice === this.computerChoice) {
            this.result = 'Ничья!';
          } else if (
            (this.playerChoice === 'Камень' && this.computerChoice === 'Ножницы') ||
            (this.playerChoice === 'Ножницы' && this.computerChoice === 'Бумага') ||
            (this.playerChoice === 'Бумага' && this.computerChoice === 'Камень')
          ) {
            this.result = 'Вы выиграли!';
            this.playerScore++;
          } else {
            this.result = 'Компьютер выиграл!';
            this.computerScore++;
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
