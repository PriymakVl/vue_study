<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Цифровые часы — Vue 3</title>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .clock-wrap {
      display: inline-block;
      padding: 20px 28px;
      border-radius: 12px;
      background: #111;
      color: #0ff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      text-align: center;
      user-select: none;
    }
    .time {
      font-size: 48px;
      line-height: 1;
      letter-spacing: 2px;
    }
    .date {
      margin-top: 8px;
      font-size: 14px;
      color: #9ef;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="clock-wrap">
      <div class="time">{{ time }}</div>
      <div class="date">{{ dateStr }}</div>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          time: '',
          dateStr: '',
          timerId: null,
          // локаль можно сменить на 'uk-UA' или 'en-US' при желании
          locale: 'ru-RU'
        }
      },
      methods: {
        pad(n) {
          return n < 10 ? '0' + n : '' + n
        },
        tick() {
          const now = new Date()
          const h = this.pad(now.getHours())
          const m = this.pad(now.getMinutes())
          const s = this.pad(now.getSeconds())
          this.time = `${h}:${m}:${s}`

          // Человекочитаемая дата под часами
          this.dateStr = now.toLocaleDateString(this.locale, {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          })
        }
      },
      mounted() {
        this.tick() // моментальный первый рендер
        this.timerId = setInterval(this.tick, 1000)
      },
      beforeUnmount() {
        clearInterval(this.timerId)
      }
    })

    app.mount('#app')
  </script>
</body>
</html>
