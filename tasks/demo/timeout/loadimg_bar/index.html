<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <title>Vue 3 Прогресс-бар</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f3f4f6;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
      width: min(400px, 90vw);
      text-align: center;
    }

    .progress-container {
      width: 100%;
      height: 30px;
      background: #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      margin: 16px 0;
    }

    .progress-bar {
      height: 100%;
      background: #3b82f6;
      text-align: center;
      line-height: 30px;
      color: #fff;
      font-weight: bold;
      transition: width .2s;
    }

    button {
      margin: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="card">
      <h2>Загрузка</h2>
      <div class="progress-container">
        <div class="progress-bar" :style="{width: progress + '%'}">{{ progress }}%</div>
      </div>
      <button @click="start" :disabled="running || progress >= 100">Старт</button>
      <button @click="reset" :disabled="running || progress === 0">Сброс</button>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          progress: 0,
          running: false,
          timer: null
        }
      },
      methods: {
        start() {
          if (this.running) return;
          this.running = true;
          this.timer = setInterval(() => {
            if (this.progress < 100) {
              this.progress++;
            } else {
              this.stop();
            }
          }, 50); // скорость заполнения (50мс = быстро, можно увеличить)
        },
        stop() {
          clearInterval(this.timer);
          this.timer = null;
          this.running = false;
        },
        reset() {
          this.progress = 0;
        }
      },
      beforeUnmount() {
        if (this.timer) clearInterval(this.timer);
      }
    }).mount('#app');
  </script>
</body>

</html>
