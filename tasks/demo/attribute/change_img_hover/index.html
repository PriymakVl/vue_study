<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Change Img Hover</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <img
    :src="currentImage"
    @mouseenter="hoverImage"
    @mouseleave="resetImage"
  >
</div>

<script src="script.js"></script>

</body>
</html>
