<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Vue 3 Слайдер</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f3f4f6; margin:0; }
    .card { background:#fff; padding:24px; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.08); width:min(500px, 92vw); text-align:center; }
    img { width:100%; height:300px; object-fit:cover; border-radius:12px; }
    .btns { margin-top:14px; display:flex; gap:10px; justify-content:center; }
    button { padding:10px 16px; border:none; border-radius:10px; font-weight:bold; background:#3b82f6; color:#fff; cursor:pointer; }
    button:hover { background:#2563eb; }
    button:disabled { background:#9ca3af; cursor:not-allowed; }
  </style>
</head>
<body>
  <div id="app">
    <div class="card">
      <h2>Слайдер</h2>
      <img :src="images[current]" alt="слайд" />
      <div class="btns">
        <button @click="start" :disabled="running">start</button>
        <button @click="stop" :disabled="!running">stop</button>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          images: [
            "https://picsum.photos/id/1015/600/400",
            "https://picsum.photos/id/1025/600/400",
            "https://picsum.photos/id/1035/600/400",
            "https://picsum.photos/id/1045/600/400"
          ],
          current: 0,
          timer: null,
          running: false,
          interval: 1000 // задержка между слайдами (мс)
        }
      },
      methods: {
        nextSlide() {
          this.current = (this.current + 1) % this.images.length;
        },
        start() {
          if (this.running) return;
          this.running = true;
          this.timer = setInterval(this.nextSlide, this.interval);
        },
        stop() {
          clearInterval(this.timer);
          this.timer = null;
          this.running = false;
        }
      },
      beforeUnmount() {
        if (this.timer) clearInterval(this.timer);
      }
    }).mount('#app');
  </script>
</body>
</html>
