<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Смена изображений</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      text-align: center;
      padding-top: 50px;
    }
    img {
      width: 300px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <img :src="images[currentIndex]" alt="Картинка" />
    <br />
    <button @click="nextImage">Следующее изображение</button>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          images: [
            'https://picsum.photos/id/1015/600/400',
            'https://picsum.photos/id/1025/600/400',
            'https://picsum.photos/id/1035/600/400'
          ],
          currentIndex: 0
        };
      },
      methods: {
        nextImage() {
          this.currentIndex = (this.currentIndex + 1) % this.images.length;
        }
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
