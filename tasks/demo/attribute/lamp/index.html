<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Лампочка Vue 3</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body :style="{ backgroundColor: isOn ? '#fffacd' : '#2f2f2f' }">

  <div id="app">
    <img :src="isOn ? bulbOn : bulbOff" alt="Лампочка">
    <div>
      <button @click="turnOn">Включить</button>
      <button @click="turnOff">Выключить</button>
    </div>
  </div>

<script src="main.js"></script>

</body>
</html>
