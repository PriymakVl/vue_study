<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Vue 3 Color Switch</title>
	<script src="https://unpkg.com/vue@3"></script>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>

	<div id="app">
		<div class="square" :style="{ backgroundColor: color }"></div>
		<div style="text-align: center;">
			<button class="red-btn" @click="setColor('red')">Red</button>
			<button class="blue-btn" @click="setColor('blue')">Blue</button>
		</div>
	</div>

	<script src="main.js"></script>
</body>
</html>
