<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Счётчик кликов на Vue 3 (Options API)</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <h1>Вы кликнули {{ count }} раз(а)</h1>
        <button @click="increment">Кликни меня</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
