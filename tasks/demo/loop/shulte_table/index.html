<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Таблица Шульте</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
     padding: 10px;
     height: 100vh;
     box-sizing: border-box;
     overflow: hidden;
    }

    #app {
        height: 100%;
        width: 100%;
        background-color: #eee;
    }

    .table {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      width: 100%;
      height: 100%;
    }

    .cell {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      border: 1px solid #000;
      user-select: none;
    }

    /* Область в правом верхнем углу */
    .corner {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 300px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0);
      transition: 0.3;
    }

    .corner:hover {
        background-color: rgba(0, 0, 0, 0.3);
    }

    /* Кнопка спрятана по умолчанию */
    .corner button {
      display: none;
      padding: 15px 25px;
      font-size: 14px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Кнопка появляется только при наведении */
    .corner:hover button {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="table">
      <div v-for="(num, index) in numbers" :key="index" class="cell">
        {{ num }}
      </div>
    </div>

    <div class="corner">
      <button @click="generateNumbers">Обновить</button>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          numbers: []
        }
      },
      methods: {
        generateNumbers() {
          let arr = Array.from({length: 25}, (_, i) => i + 1);
          // Перемешивание Фишера-Йетса
          for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          this.numbers = arr;
        }
      },
      mounted() {
        this.generateNumbers();
      }
    }).mount('#app');
  </script>
</body>
</html>
