<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vue 3 Random Color Generator</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .color-box {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-shadow: 1px 1px 2px black;
      font-size: 24px;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 1px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="color-box" :style="{ backgroundColor: color }">
      {{ color }}
    </div>
    <button @click="generateColor">Сгенерировать цвет</button>
  </div>

  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const app = Vue.createApp({
      data() {
        return {
          color: '#3498db' // начальный цвет
        }
      },
      methods: {
        generateColor() {
          const randomHex = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
          this.color = randomHex;
        }
      }
    });

    app.mount("#app");
  </script>
</body>

</html>
