<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Vue CDN</title>
</head>
<body>

<div id="app">
    <h1>{{ greeting }}</h1>
</div>

<!-- Vue 3 CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            greeting: 'Привет, Гость'
        }
    }
}).mount('#app');
</script>

<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 30px;
    }

    h1 {
        color:blueviolet;
    }
</style>

</body>
</html>
